<svg xmlns="http://www.w3.org/2000/svg" class="pg-smile" viewBox="1 1.7 22 22" width="1em" height="1em" overflow="visible" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- playlistGo kitty with headphones. Still when paused; animates only under .is-playing (Menu.tsx):
       - gentle head bob to the beat, vibing to the music
       - 28s loop: sings ~3s with happy closed eyes -> ~7s rest (blink) -> cute head tilt
         -> ~7s rest (blink) -> sings ~3s -> rest.  keyframes are generated (1% = 0.28s)
       viewBox is cropped tight to the drawing so it fills 1em like a react-icon -->
  <style>
    .pg-smile .pg-bob { transform-origin: 12px 21px; }
    .pg-smile .pg-tilt { transform-origin: 12px 19px; }
    .pg-smile .pg-open { transform-origin: 12px 16px; transform: scaleY(0); }
    .pg-smile .pg-eyes { transform-origin: 12px 14px; }
    .pg-smile .pg-happy { opacity: 0; }
    .is-playing .pg-smile .pg-bob { animation: pg-smile-bob 1.4s ease-in-out infinite; }
    .is-playing .pg-smile .pg-tilt { animation: pg-smile-tilt 28s ease-in-out infinite; }
    .is-playing .pg-smile .pg-open { animation: pg-smile-sing 28s linear infinite; }
    .is-playing .pg-smile .pg-eyes { animation: pg-smile-blink 28s linear infinite, pg-smile-awake 28s linear infinite; }
    .is-playing .pg-smile .pg-happy { animation: pg-smile-happy 28s linear infinite; }
    /* soft sway: lean, dip on the beat, lean the other way */
    @keyframes pg-smile-bob {
      0%, 100% { transform: rotate(-3deg); }
      25%, 75% { transform: translateY(0.5px); }
      50% { transform: rotate(3deg); }
    }
    @keyframes pg-smile-tilt {
      0% { transform: rotate(0deg); }
      36.43% { transform: rotate(0deg); }
      38.21% { transform: rotate(-11deg); }
      42.5% { transform: rotate(-11deg); }
      44.64% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pg-smile-sing {
      0% { transform: scaleY(0); }
      0.71% { transform: scaleY(0); }
      1.25% { transform: scaleY(0.9); }
      2.32% { transform: scaleY(0.3); }
      3.39% { transform: scaleY(1); }
      4.46% { transform: scaleY(0.2); }
      5.54% { transform: scaleY(0.7); }
      6.61% { transform: scaleY(1); }
      7.68% { transform: scaleY(0.4); }
      8.75% { transform: scaleY(0.9); }
      9.82% { transform: scaleY(0.2); }
      11.25% { transform: scaleY(0); }
      68.57% { transform: scaleY(0); }
      69.11% { transform: scaleY(0.9); }
      70.18% { transform: scaleY(0.3); }
      71.25% { transform: scaleY(1); }
      72.32% { transform: scaleY(0.2); }
      73.39% { transform: scaleY(0.7); }
      74.46% { transform: scaleY(1); }
      75.54% { transform: scaleY(0.4); }
      76.61% { transform: scaleY(0.9); }
      77.68% { transform: scaleY(0.2); }
      79.11% { transform: scaleY(0); }
      100% { transform: scaleY(0); }
    }
    @keyframes pg-smile-blink {
      0% { transform: scaleY(1); }
      53.57% { transform: scaleY(1); }
      53.86% { transform: scaleY(0.1); }
      54.29% { transform: scaleY(1); }
      91.43% { transform: scaleY(1); }
      91.71% { transform: scaleY(0.1); }
      92.14% { transform: scaleY(1); }
      100% { transform: scaleY(1); }
    }
    @keyframes pg-smile-happy {
      0% { opacity: 0; }
      0.54% { opacity: 0; }
      1.25% { opacity: 1; }
      10.71% { opacity: 1; }
      11.61% { opacity: 0; }
      68.39% { opacity: 0; }
      69.11% { opacity: 1; }
      78.57% { opacity: 1; }
      79.46% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes pg-smile-awake {
      0% { opacity: 1; }
      0.54% { opacity: 1; }
      1.25% { opacity: 0; }
      10.71% { opacity: 0; }
      11.61% { opacity: 1; }
      68.39% { opacity: 1; }
      69.11% { opacity: 0; }
      78.57% { opacity: 0; }
      79.46% { opacity: 1; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .is-playing .pg-smile * { animation: none !important; }
    }
  </style>
  <defs>
    <radialGradient id="pg-kitty-fur" cx=".42" cy=".3" r=".85">
      <stop offset="0" stop-color="#fffaf2" />
      <stop offset=".55" stop-color="#ffe6c8" />
      <stop offset="1" stop-color="#f7c99c" />
    </radialGradient>
  </defs>
  <g class="pg-bob"><g class="pg-tilt">
    <!-- soft rounded ears with pink insides -->
    <path d="M4.3 11.2C3.6 7.6 4.1 4.6 5.3 4.1c1-.4 3 1.2 4.7 3.1M19.7 11.2c.7-3.6.2-6.6-1-7.1-1-.4-3 1.2-4.7 3.1" fill="url(#pg-kitty-fur)" stroke="#a8673f" stroke-width=".7" />
    <path d="M5.4 9.2c-.2-1.6 0-3 .5-3.3.5-.2 1.5.6 2.4 1.6zM18.6 9.2c.2-1.6 0-3-.5-3.3-.5-.2-1.5.6-2.4 1.6z" fill="#ffb3c8" />
    <!-- chubby round head -->
    <ellipse cx="12" cy="14.2" rx="8.9" ry="7.1" fill="url(#pg-kitty-fur)" stroke="#a8673f" stroke-width=".7" />
    <!-- tiny tabby stripes on the forehead -->
    <path d="M11 8v1.1M12 7.7v1.4M13 8v1.1" stroke="#eab38a" stroke-width=".7" />
    <!-- blush -->
    <ellipse cx="6.5" cy="16.3" rx="1.5" ry=".85" fill="#ff8fab" opacity=".5" />
    <ellipse cx="17.5" cy="16.3" rx="1.5" ry=".85" fill="#ff8fab" opacity=".5" />
    <!-- big sparkly eyes (blink), swapped for happy ^ ^ eyes while singing -->
    <g class="pg-eyes">
      <ellipse cx="8.5" cy="14" rx="1.3" ry="1.5" fill="#3b2418" />
      <ellipse cx="15.5" cy="14" rx="1.3" ry="1.5" fill="#3b2418" />
      <circle cx="9" cy="13.4" r=".5" fill="#fff" />
      <circle cx="16" cy="13.4" r=".5" fill="#fff" />
      <circle cx="8.1" cy="14.6" r=".22" fill="#fff" />
      <circle cx="15.1" cy="14.6" r=".22" fill="#fff" />
    </g>
    <path class="pg-happy" d="M7.3 14.4q1.2-1.3 2.4 0M14.3 14.4q1.2-1.3 2.4 0" stroke="#3b2418" stroke-width=".85" />
    <!-- little singing mouth, tiny nose, :3 mouth -->
    <ellipse class="pg-open" cx="12" cy="16.9" rx=".8" ry=".95" fill="#d9536f" />
    <path d="M11.45 15h1.1l-.55.6z" fill="#ff86a6" stroke="#ff86a6" stroke-width=".35" />
    <path d="M11 15.9q.5.55 1 0 .5.55 1 0" stroke="#a8673f" stroke-width=".55" />
    <!-- pastel headphones: band over the head, cushioned cups -->
    <path d="M3.3 13C3.3 3 20.7 3 20.7 13" stroke="#7d6b91" stroke-width="1.4" />
    <rect x="1.4" y="11.6" width="3.6" height="5.8" rx="1.8" fill="#ff93b5" stroke="#7d6b91" stroke-width=".7" />
    <rect x="19" y="11.6" width="3.6" height="5.8" rx="1.8" fill="#ff93b5" stroke="#7d6b91" stroke-width=".7" />
    <path d="M4.4 12.6v3.8M19.6 12.6v3.8" stroke="#ffd0df" stroke-width=".7" />
  </g></g>
</svg>
