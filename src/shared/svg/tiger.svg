<svg xmlns="http://www.w3.org/2000/svg" class="pg-smile" viewBox="1 1.7 22 22" width="1em" height="1em" overflow="visible" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- playlistGo music buddy: tiger. GENERATED by scripts/gen_characters.py, edit that instead.
       Still when paused; animates only inside .is-playing. viewBox is cropped tight so it fills 1em like a react-icon -->
  <style>
    .pg-smile .pg-bob { transform-origin: 12px 21px; }
    .pg-smile .pg-open { transform-origin: 12px 16px; transform: scaleY(0); }
    .pg-smile .pg-eyes { transform-origin: 12px 14px; }
    .pg-smile .pg-happy { opacity: 0; }
    .pg-smile .pg-float { opacity: 0; }
    .is-playing .pg-smile .pg-bob { animation: pg-smile-bob 7s ease-in-out infinite; }
    .is-playing .pg-smile .pg-open { animation: pg-smile-sing 28s linear infinite; }
    .is-playing .pg-smile .pg-eyes { animation: pg-smile-blink 28s linear infinite, pg-smile-awake 28s linear infinite; }
    .is-playing .pg-smile .pg-happy { animation: pg-smile-happy 28s linear infinite; }
    .is-playing .pg-smile .pg-float-l { animation: pg-smile-float-l 7s ease-out infinite; }
    .is-playing .pg-smile .pg-float-r { animation: pg-smile-float-r 7s ease-out infinite; }
    .is-playing .pg-smile .pg-d1 { animation-delay: 1.75s; }
    .is-playing .pg-smile .pg-d2 { animation-delay: 3.5s; }
    .is-playing .pg-smile .pg-d3 { animation-delay: 5.25s; }
    /* notes + hearts drift up and outward from the ear cups, then fade */
    @keyframes pg-smile-float-l {
      0% { opacity: 0; transform: translate(0, 0) scale(.6); }
      4% { opacity: 1; }
      24% { opacity: .9; }
      32% { opacity: 0; transform: translate(-1.6px, -6.5px) scale(1) rotate(-12deg); }
      100% { opacity: 0; transform: translate(-1.6px, -6.5px) scale(1); }
    }
    @keyframes pg-smile-float-r {
      0% { opacity: 0; transform: translate(0, 0) scale(.6); }
      4% { opacity: 1; }
      24% { opacity: .9; }
      32% { opacity: 0; transform: translate(1.6px, -6.5px) scale(1) rotate(12deg); }
      100% { opacity: 0; transform: translate(1.6px, -6.5px) scale(1); }
    }
    /* the old slight lean left / right (same 3deg, same pace), no up / down dip:
       sways ~2.8s, then eases back to center and holds still ~4.2s so it never gets busy */
    @keyframes pg-smile-bob {
      0%, 40%, 100% { transform: rotate(0); }
      5%, 25% { transform: rotate(-3deg); }
      15%, 35% { transform: rotate(3deg); }
    }
    @keyframes pg-smile-sing {
      0% { transform: scaleY(0); }
      0.71% { transform: scaleY(0); }
      1.25% { transform: scaleY(0.9); }
      2.32% { transform: scaleY(0.3); }
      3.39% { transform: scaleY(1); }
      4.46% { transform: scaleY(0.2); }
      5.54% { transform: scaleY(0.7); }
      6.61% { transform: scaleY(1); }
      7.68% { transform: scaleY(0.4); }
      8.75% { transform: scaleY(0.9); }
      9.82% { transform: scaleY(0.2); }
      11.25% { transform: scaleY(0); }
      68.57% { transform: scaleY(0); }
      69.11% { transform: scaleY(0.9); }
      70.18% { transform: scaleY(0.3); }
      71.25% { transform: scaleY(1); }
      72.32% { transform: scaleY(0.2); }
      73.39% { transform: scaleY(0.7); }
      74.46% { transform: scaleY(1); }
      75.54% { transform: scaleY(0.4); }
      76.61% { transform: scaleY(0.9); }
      77.68% { transform: scaleY(0.2); }
      79.11% { transform: scaleY(0); }
      100% { transform: scaleY(0); }
    }
    @keyframes pg-smile-blink {
      0% { transform: scaleY(1); }
      53.57% { transform: scaleY(1); }
      53.86% { transform: scaleY(0.1); }
      54.29% { transform: scaleY(1); }
      91.43% { transform: scaleY(1); }
      91.71% { transform: scaleY(0.1); }
      92.14% { transform: scaleY(1); }
      100% { transform: scaleY(1); }
    }
    @keyframes pg-smile-happy {
      0% { opacity: 0; }
      0.54% { opacity: 0; }
      1.25% { opacity: 1; }
      10.71% { opacity: 1; }
      11.61% { opacity: 0; }
      68.39% { opacity: 0; }
      69.11% { opacity: 1; }
      78.57% { opacity: 1; }
      79.46% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes pg-smile-awake {
      0% { opacity: 1; }
      0.54% { opacity: 1; }
      1.25% { opacity: 0; }
      10.71% { opacity: 0; }
      11.61% { opacity: 1; }
      68.39% { opacity: 1; }
      69.11% { opacity: 0; }
      78.57% { opacity: 0; }
      79.46% { opacity: 1; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .is-playing .pg-smile * { animation: none !important; }
    }
  </style>
  <defs>
    <radialGradient id="pg-fur-tiger" cx=".42" cy=".3" r=".85">
      <stop offset="0" stop-color="#fff1d6" />
      <stop offset=".55" stop-color="#ffbe6b" />
      <stop offset="1" stop-color="#f39a35" />
    </radialGradient>
  </defs>
  <g class="pg-bob">
