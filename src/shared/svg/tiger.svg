    <ellipse cx="6.5" cy="16.3" rx="1.5" ry=".85" fill="#ff8fab" opacity=".5" />
    <ellipse cx="17.5" cy="16.3" rx="1.5" ry=".85" fill="#ff8fab" opacity=".5" />
    <g class="pg-eyes">
      <ellipse cx="8.5" cy="14" rx="1.3" ry="1.5" fill="#2e1a0e" />
