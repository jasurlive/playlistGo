    <ellipse class="pg-open" cx="12" cy="16.9" rx=".8" ry=".95" fill="#d9536f" />
    <path d="M11.45 15h1.1l-.55.6z" fill="#ff86a6" stroke="#ff86a6" stroke-width=".35" />
    <path d="M11 15.9q.5.55 1 0 .5.55 1 0" stroke="#9a5420" stroke-width=".55" />
