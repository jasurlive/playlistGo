  <g transform="translate(21.6 9.6)"><path class="pg-float pg-float-r pg-d1" d="M0 1.3C-1.7 0-1.7-1.5-.85-1.5-.35-1.5 0-1.1 0-.75 0-1.1.35-1.5.85-1.5 1.7-1.5 1.7 0 0 1.3z" fill="#ff6f9c" /></g>
  <g transform="translate(21.4 9.6)"><path class="pg-float pg-float-r pg-d2" d="M-.2 .6a.95.7-20 1 1 1.1-.4V-3.2q1.3.4 1.4 1.7-.6-.7-1.4-.8" fill="#6b5fa8" stroke="#6b5fa8" stroke-width=".5" /></g>
