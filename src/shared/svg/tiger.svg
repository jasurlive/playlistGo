    <rect x="1.4" y="11.6" width="3.6" height="5.8" rx="1.8" fill="#b9a8ff" stroke="#6b5fa8" stroke-width=".7" />
    <rect x="19" y="11.6" width="3.6" height="5.8" rx="1.8" fill="#b9a8ff" stroke="#6b5fa8" stroke-width=".7" />
    <path d="M4.4 12.6v3.8M19.6 12.6v3.8" stroke="#e4ddff" stroke-width=".7" />
  </g>
